{% extends "base.html" %}
{% block content %}
<div class="card auth-panel auth-panel-tight">
  <h2 data-i18n="reset_title">Reset Password</h2>
  <p data-i18n="reset_copy">Enter your email and we’ll send you a reset link.</p>
  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    <button type="submit" class="primary-btn" data-i18n="reset_send">Send Reset Link</button>
  </form>
</div>
{% endblock %}
