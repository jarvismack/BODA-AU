{% extends "base.html" %}
{% block content %}
<div class="card auth-panel auth-panel-tight">
  <h2 data-i18n="reset_confirm_title">Set New Password</h2>
  <form method="post">
    {% csrf_token %}
    {{ form.new_password1.label_tag }}
    {{ form.new_password1 }}
    {{ form.new_password2.label_tag }}
    {{ form.new_password2 }}
    <button type="submit" class="primary-btn" data-i18n="reset_confirm_btn">Update Password</button>
  </form>
</div>
{% endblock %}
