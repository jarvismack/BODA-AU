databases:
  - name: boda-au-db
    databaseName: bodaau
    user: bodaau

services:
  - type: web
    name: boda-au
    runtime: python
    rootDir: bodaboda_web
    buildCommand: ./build.sh
    startCommand: python -m gunicorn bodaboda_web.asgi:application -k uvicorn.workers.UvicornWorker
    plan: free
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: bodaboda_web.settings.prod
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: DATABASE_URL
        fromDatabase:
          name: boda-au-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: boda-au.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://boda-au.onrender.com
      - key: SECURE_SSL_REDIRECT
        value: "true"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: CSRF_COOKIE_SECURE
        value: "true"
